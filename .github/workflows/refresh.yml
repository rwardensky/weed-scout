name: Refresh Weed Scout

on:
  schedule:
    - cron: "0 11 * * *" # every day, 6am US Eastern (11:00 UTC)
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # raw catalogs, cached product ratings and the Reddit archive live here between runs
      - name: Restore scraper cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: scout-cache-${{ github.run_id }}
          restore-keys: scout-cache-

      - name: Scrape vendors
        run: node scrape.mjs

      - name: Save scraper cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: scout-cache-${{ github.run_id }}

      - name: Commit fresh data
        run: |
          git config user.name "weed-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
