name: Refresh Weed Scout

on:
  schedule:
    # Off the hour: GitHub often skips schedules set exactly on the hour.
    - cron: "37 10 * * *" # ~5:37am US Eastern
    - cron: "37 22 * * *" # ~5:37pm US Eastern (backup if the morning run is skipped)
  workflow_dispatch: # "Run workflow" button on the Actions tab
  push: # run right away when this schedule file or a WAR/Crysp capture changes
    branches: [main]
    paths: [.github/workflows/refresh.yml, captures/**, images/**]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # always the newest main (code + last data), not the commit that queued the run
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # raw catalogs, cached product ratings and the Reddit archive live here between runs
      - name: Restore scraper cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: scout-cache-${{ github.run_id }}
          restore-keys: scout-cache-

      - name: Scrape vendors
        run: node scrape.mjs

      - name: Save scraper cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: scout-cache-${{ github.run_id }}

      # phone alerts: Telegram (TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID secrets) or ntfy (NTFY_TOPIC)
      - name: Send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node alerts.mjs

      - name: Commit fresh data
        run: |
          git config user.name "weed-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          if [ -f alerts-state.json ]; then git add alerts-state.json; fi
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
          # if something else landed meanwhile (a capture, a watchlist save, another refresh),
          # replay on top of it; for the generated files this run's fresh copy wins
          for try in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
